name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    needs: check
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release')) }}"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Require branch
        run: |
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "Release must run on a branch"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Fetch tags and branch
        run: |
          git fetch --tags --force
          git fetch origin "${{ github.ref_name }}"

      - id: calc
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/next-version.mjs

      - name: Bump, commit, and tag
        if: steps.calc.outputs.should_bump == 'true'
        run: |
          node scripts/bump-version.mjs "${{ steps.calc.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Version files already set to ${{ steps.calc.outputs.version }}; tagging the current commit"
          else
            git commit -m "chore: release ${{ steps.calc.outputs.version }}"
          fi
          git tag -a "${{ steps.calc.outputs.tag }}" -m "${{ steps.calc.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.calc.outputs.tag }}"

      - name: Ensure tag exists
        if: steps.calc.outputs.should_bump != 'true'
        run: |
          TAG="${{ steps.calc.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}"; then
            echo "Reusing existing ${TAG}"
            exit 0
          fi
          git fetch origin "${{ github.ref_name }}"
          SHA="$(git log "origin/${{ github.ref_name }}" --format='%H %s' | awk -v v="chore: release ${{ steps.calc.outputs.version }}" 'index($0, v) { print $1; exit }')"
          if [ -z "${SHA}" ]; then
            echo "Missing tag ${TAG} and no matching release commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${SHA}" -m "${TAG}"
          git push origin "${TAG}"

  publish:
    needs: [check, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/fetch-binaries.sh') }}

      - name: Fetch sidecars
        shell: bash
        run: |
          if ! bash scripts/fetch-binaries.sh --check; then
            bash scripts/fetch-binaries.sh
          fi

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ZI Player ${{ needs.version.outputs.tag }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  checksums:
    needs: [version, publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          WORK="$(mktemp -d)"
          gh release download "${TAG}" --repo "${{ github.repository }}" --dir "${WORK}"
          cd "${WORK}"
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --repo "${{ github.repository }}" --clobber
