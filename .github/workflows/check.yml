name: Check

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Sidecar script checks
        if: runner.os == 'Linux'
        run: |
          bash scripts/check-sidecars.sh
          bash scripts/fetch-binaries.sh --self-test

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: runner.os == 'Linux'
        run: npm run test:e2e

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/fetch-binaries.sh') }}

      - name: Fetch sidecars
        shell: bash
        run: |
          if ! bash scripts/fetch-binaries.sh --check; then
            bash scripts/fetch-binaries.sh
          fi

      - name: Cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
